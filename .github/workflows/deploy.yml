name: Publish Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: "5.x"

      - name: GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0

      - name: Check
        run: pnpm check

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser
        run: pnpm test:e2e

      - name: Set package version
        working-directory: ./packages/glts
        run: npm pkg set version="${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Copy README into package
        run: cp README.md packages/glts/README.md

      - name: Publish @drawcall/glts
        working-directory: ./packages/glts
        run: npm publish --access public --provenance --tag latest

      - name: Wait for @drawcall/glts on npm
        env:
          PACKAGE_VERSION: ${{ steps.gitversion.outputs.fullSemVer }}
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(npm view "@drawcall/glts@latest" version 2>/dev/null || true)" = "$PACKAGE_VERSION" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "@drawcall/glts@$PACKAGE_VERSION was not visible on npm after 5 minutes." >&2
          exit 1

      - name: Trigger @drawcall/vite release
        env:
          GH_TOKEN: ${{ secrets.DRAWCALL_RELEASE_TOKEN }}
          PACKAGE_VERSION: ${{ steps.gitversion.outputs.fullSemVer }}
        run: |
          gh api --method POST repos/drawcall-ai/vite/dispatches \
            --raw-field event_type=drawcall-dependency-published \
            --raw-field "client_payload[package]=@drawcall/glts" \
            --raw-field "client_payload[version]=$PACKAGE_VERSION"
